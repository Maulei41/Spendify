name: CD - Deploy to Server

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'

jobs:
  deploy:
    runs-on: self-hosted  

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permissions to mvnw
        run: chmod +x mvnw

      - name: Install system dependencies (OpenCV, Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-java tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          echo "OpenCV Java library location:"
          find /usr -name "libopencv_java*.so" 2>/dev/null | head -5
          echo "Tesseract traineddata locations:"
          find /usr/share/tesseract-ocr -name "*.traineddata" 2>/dev/null

      - name: Setup tessdata directory for application
        run: |
          mkdir -p ~/spendify/tessdata
          # Copy English traineddata
          ENG_PATH=$(find /usr/share/tesseract-ocr -name "eng.traineddata" 2>/dev/null | head -1)
          if [ -n "$ENG_PATH" ]; then
            cp "$ENG_PATH" ~/spendify/tessdata/eng.traineddata
            echo "Copied eng.traineddata from system"
          else
            wget -O ~/spendify/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata
            echo "Downloaded eng.traineddata from GitHub"
          fi
          # Copy Chinese Simplified traineddata
          CHI_PATH=$(find /usr/share/tesseract-ocr -name "chi_sim.traineddata" 2>/dev/null | head -1)
          if [ -n "$CHI_PATH" ]; then
            cp "$CHI_PATH" ~/spendify/tessdata/chi_sim.traineddata
            echo "Copied chi_sim.traineddata from system"
          else
            wget -O ~/spendify/tessdata/chi_sim.traineddata https://github.com/tesseract-ocr/tessdata/raw/main/chi_sim.traineddata
            echo "Downloaded chi_sim.traineddata from GitHub"
          fi
          echo "Contents of ~/spendify/tessdata:"
          ls -la ~/spendify/tessdata/

      - name: Build JAR with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Debug - Show built JAR
        run: |
          echo "Built JAR files:"
          ls -la target/
          find target -name "*.jar" -ls

      - name: Deploy JAR to local app directory
        run: |
          cp target/backend-*.jar ~/spendify/app.jar
          echo "New JAR deployed to ~/spendify/app.jar"

      - name: Restart Spendify service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart spendify
          sleep 8

          systemctl status spendify --no-pager

          if ! systemctl is-active --quiet spendify; then
            echo "Service failed!"
            journalctl -u spendify -n 50 --no-pager
            exit 1
          else
            echo "Service running!"
          fi