name: CD - Deploy to Server

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'

jobs:
  deploy:
    runs-on: self-hosted  

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permissions to mvnw
        run: chmod +x mvnw

      - name: Setup tessdata directory for application
        run: |
          mkdir -p ~/spendify/tessdata
          # Copy eng.traineddata from system
          ENG_PATH=$(find /usr/share/tesseract-ocr -name "eng.traineddata" 2>/dev/null | head -1)
          if [ -n "$ENG_PATH" ]; then
            cp "$ENG_PATH" ~/spendify/tessdata/eng.traineddata
            echo "Copied eng.traineddata from system"
          else
            echo "WARNING: eng.traineddata not found on system"
          fi
          # Download chi_sim.traineddata from official Tesseract repo
          CHI_SIM_PATH=$(find /usr/share/tesseract-ocr -name "chi_sim.traineddata" 2>/dev/null | head -1)
          if [ -n "$CHI_SIM_PATH" ]; then
            cp "$CHI_SIM_PATH" ~/spendify/tessdata/chi_sim.traineddata
            echo "Copied chi_sim.traineddata from system"
          else
            echo "Downloading chi_sim.traineddata..."
            curl -L -o ~/spendify/tessdata/chi_sim.traineddata \
              "https://github.com/tesseract-ocr/tessdata/raw/main/chi_sim.traineddata"
            echo "Downloaded chi_sim.traineddata"
          fi
          echo "Contents of ~/spendify/tessdata:"
          ls -la ~/spendify/tessdata/

      - name: Build JAR with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Debug - Show built JAR
        run: |
          echo "Built JAR files:"
          ls -la target/
          find target -name "*.jar" -ls

      - name: Deploy JAR to local app directory
        run: |
          cp target/backend-*.jar ~/spendify/app.jar
          echo "New JAR deployed to ~/spendify/app.jar"

      - name: Restart Spendify service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart spendify
          sleep 8

          systemctl status spendify --no-pager

          if ! systemctl is-active --quiet spendify; then
            echo "Service failed!"
            journalctl -u spendify -n 50 --no-pager
            exit 1
          else
            echo "Service running!"
          fi