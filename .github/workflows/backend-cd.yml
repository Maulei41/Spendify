name: CD - Deploy to Server

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-cd.yml'

jobs:
  deploy:
    runs-on: self-hosted  

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permissions to mvnw
        run: chmod +x mvnw

      - name: Install Tesseract OCR and language data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
          echo "Tesseract version:"
          tesseract --version
          echo "Installed languages:"
          tesseract --list-langs

      - name: Setup tessdata directory for application
        run: |
          mkdir -p ~/spendify/tessdata
          # Copy system Tesseract language data to app tessdata directory
          cp /usr/share/tesseract-ocr/*/tessdata/eng.traineddata ~/spendify/tessdata/
          cp /usr/share/tesseract-ocr/*/tessdata/chi_sim.traineddata ~/spendify/tessdata/
          echo "Copied traineddata files to ~/spendify/tessdata/"
          ls -la ~/spendify/tessdata/

      - name: Build JAR with Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Debug - Show built JAR
        run: |
          echo "Built JAR files:"
          ls -la target/
          find target -name "*.jar" -ls

      - name: Deploy JAR to local app directory
        run: |
          cp target/backend-*.jar ~/spendify/app.jar
          echo "New JAR deployed to ~/spendify/app.jar"

      - name: Restart Spendify service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart spendify
          sleep 8

          systemctl status spendify --no-pager

          if ! systemctl is-active --quiet spendify; then
            echo "Service failed!"
            journalctl -u spendify -n 50 --no-pager
            exit 1
          else
            echo "Service running!"
          fi